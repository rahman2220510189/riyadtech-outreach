# Wakes the free Render backend every morning (09:00 Dhaka = 03:00 UTC).
# During the day the backend keeps itself awake (backend/src/keepawake.ts); at night it sleeps
# so the free Neon database stays inside its 100 compute hours a month.
#
# Setup once: GitHub repo -> Settings -> Secrets and variables -> Actions -> Variables ->
# New repository variable: RENDER_URL = https://<your-service>.onrender.com  (not a secret).
# Test it: Actions tab -> "Wake backend" -> Run workflow.
# Note: GitHub pauses scheduled workflows in a public repo after 60 days without commits.
name: Wake backend

on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "20 3 * * *" # a second try, in case the first wake-up was slow
  workflow_dispatch:

permissions: {}

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request /health
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "RENDER_URL is not set (Settings -> Secrets and variables -> Actions -> Variables)."
            exit 0
          fi
          curl --silent --show-error --fail --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 \
            -A "RiyadTechBot wake-up" "${RENDER_URL%/}/health"
          echo
